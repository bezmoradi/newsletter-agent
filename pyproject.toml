[project]
name = "newsletter-agent"
version = "0.1.0"
description = "Daily email newsletters for one operator: collects feeds, videos and web search results, has Claude score them against each newsletter's profile, and emails the best."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.175",
    "psycopg[binary]>=3.3.6,<4",
    "requests>=2.34.2,<3",
    "youtube-transcript-api==1.2.4",
]

[project.scripts]
newsletter-agent = "newsletter_agent.cli:main"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "pylint==4.1.3",
    "ruff>=0.14",
    "squawk-cli==2.70.0",
    "typos==1.51.1",
    "vulture==2.16",
    "zizmor==1.31.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv]
build-constraint-dependencies = [
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "T10", "T20", "C90", "TID251"]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 19

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"claude_agent_sdk".msg = "Only llm.py talks to Claude."
"psycopg".msg = "Only store.py talks to Postgres."
"urllib.request".msg = "Only http.py makes HTTP requests."
"requests".msg = "Only enrich.py uses requests, for YouTube transcripts."
"youtube_transcript_api".msg = "Only enrich.py fetches YouTube transcripts."
"smtplib".msg = "Only mail.py talks to Gmail."
"imaplib".msg = "Only mail.py talks to Gmail."

[tool.ruff.lint.per-file-ignores]
"src/newsletter_agent/llm.py" = ["TID251"]
"src/newsletter_agent/store.py" = ["TID251"]
"src/newsletter_agent/http.py" = ["TID251", "S310"]
"src/newsletter_agent/mail.py" = ["TID251"]
"src/newsletter_agent/enrich.py" = ["TID251"]
"src/newsletter_agent/cli.py" = ["T201"]
"src/newsletter_agent/sources/feed.py" = ["S314"]
"src/newsletter_agent/sources/sitemap.py" = ["S314"]
"scripts/*.py" = ["T201", "S607"]

[tool.mypy]
files = ["src", "scripts"]
strict = true

[tool.vulture]
paths = ["src", "scripts"]
ignore_names = [
    "format",
    "handle_starttag",
    "handle_endtag",
    "handle_data",
    "redirect_request",
    "https_open",
    "_create_connection",
]

[tool.deptry]
known_first_party = ["newsletter_agent", "repository"]
