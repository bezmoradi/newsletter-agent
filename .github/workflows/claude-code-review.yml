name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Note when the review starts
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check for the owner's override
        id: override
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx review-override; then
            echo "The review-override label is on this pull request, so Claude's approval isn't required."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.override.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pin the code-review plugin
        if: steps.override.outputs.skip != 'true'
        env:
          MARKETPLACE: ${{ runner.temp }}/review-plugins
        run: |
          mkdir -p "$MARKETPLACE/.claude-plugin"
          cat > "$MARKETPLACE/.claude-plugin/marketplace.json" <<'EOF'
          {"name": "pinned-review", "description": "Anthropic's code-review plugin, pinned to one commit", "owner": {"name": "newsletter-agent"}, "plugins": [{"name": "code-review", "source": {"source": "git-subdir", "url": "https://github.com/anthropics/claude-plugins-official.git", "path": "plugins/code-review", "sha": "9780cf407f5593727b668bae95a0c4ae2e0de1ae"}}]}
          EOF

      - name: Run Claude Code Review
        if: steps.override.outputs.skip != 'true'
        id: claude-review
        timeout-minutes: 30
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ runner.temp }}/review-plugins
          plugins: 'code-review@pinned-review'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"findings":{"type":"integer","minimum":0,"description":"How many problems you posted as inline comments on this pull request, 0 when you posted none"}},"required":["findings"]}'

      - name: Require Claude's approval
        if: steps.override.outputs.skip != 'true'
        env:
          RESULT: ${{ steps.claude-review.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.start.outputs.at }}
        run: |
          findings=$(printf '%s' "$RESULT" | jq -r '.findings // empty' 2>/dev/null || true)
          if [ -z "$findings" ]; then
            echo "::error title=No review::Claude returned no review. It skips pull requests that change this workflow. If that is expected, add the review-override label and re-run this job."
            exit 1
          fi
          posted=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/comments" --jq ".[] | select(.user.type == \"Bot\" and .created_at >= \"$STARTED\") | .id" | wc -l | tr -d ' ')
          if [ "$findings" != "0" ] || [ "$posted" != "0" ]; then
            echo "::error title=Changes requested::Claude reported $findings finding(s), and $posted inline comment(s) were posted during this review. Fix them and push, or, if Claude is wrong, add the review-override label and re-run this job."
            exit 1
          fi
          echo "Claude approved: no findings, and no inline comments posted."
