default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: no-comments
        name: No comments
        entry: python3 scripts/check_no_comments.py
        language: system
        pass_filenames: false
        always_run: true
      - id: no-tests
        name: No tests
        entry: python3 scripts/check_no_tests.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
      - id: vulture
        name: Dead code
        entry: uv run --locked vulture
        language: system
        pass_filenames: false
        types: [python]
      - id: deptry
        name: Dependencies
        entry: uv run --locked deptry .
        language: system
        pass_filenames: false
        always_run: true
      - id: typos
        name: Spelling
        entry: uv run --locked typos
        language: system
        pass_filenames: false
        always_run: true
      - id: squawk
        name: Migrations
        entry: uv run --locked squawk
        language: system
        files: ^src/newsletter_agent/migrations/.*\.sql$
      - id: large-files
        name: Large files
        entry: uv run --locked check-added-large-files
        language: system
      - id: zizmor
        name: Workflows
        entry: uv run --locked zizmor --offline
        language: system
        files: ^\.github/workflows/
      - id: mypy
        name: Types
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: duplicates
        name: Duplicates
        entry: uv run --locked pylint --disable=all --enable=duplicate-code src scripts
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: vulnerabilities
        name: Vulnerabilities
        entry: uv audit --locked --preview-features audit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: secrets
        name: Secrets
        entry: gitleaks git --config .gitleaks.toml --log-opts="--full-history --diff-filter=tuxdb HEAD" --redact --no-banner .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
